<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Grados</title>
</head>
<body>
     <form id="mi-formulario">

         <label for="name">Ingrese la temperatura en Celsius:</label>
     
         <input type="number" id="celsius" name="name" size="10" />
         <input type="submit" value="Send Request" />

         <label for="number">Temperatura en grados Farenheit:</label>
         <input type="number" id="farenheit" name="name" size="10" />
     
         <label for="name">Temperatura en grados Kelvin:</label>
         <input type="number" id="kelvin" name="name" size="10" />
     </form>


    <script src="app.js"></script>
</body>
</html>
